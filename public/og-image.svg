<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#0066cc"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle dots pattern -->
  <g fill="rgba(255,255,255,0.08)">
    <circle cx="100" cy="80" r="1.5"/><circle cx="250" cy="120" r="1"/><circle cx="400" cy="50" r="1.5"/>
    <circle cx="550" cy="150" r="1"/><circle cx="700" cy="90" r="2"/><circle cx="850" cy="60" r="1"/>
    <circle cx="1000" cy="130" r="1.5"/><circle cx="1100" cy="80" r="1"/><circle cx="150" cy="500" r="1"/>
    <circle cx="350" cy="550" r="1.5"/><circle cx="600" cy="520" r="1"/><circle cx="800" cy="560" r="1.5"/>
    <circle cx="950" cy="500" r="1"/><circle cx="1050" cy="550" r="2"/><circle cx="1150" cy="520" r="1"/>
    <circle cx="200" cy="300" r="1"/><circle cx="500" cy="350" r="1.5"/><circle cx="900" cy="320" r="1"/>
  </g>
  
  <!-- Main text -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="96" font-weight="800" fill="white" letter-spacing="-2">VoidSay</text>
  
  <!-- Accent line under title -->
  <rect x="450" y="310" width="300" height="4" rx="2" fill="url(#accent)"/>
  
  <!-- Subtitle -->
  <text x="600" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="400" fill="rgba(255,255,255,0.7)" letter-spacing="-1">Comment on any website.</text>
  
  <!-- Bottom tagline -->
  <text x="600" y="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="300" fill="rgba(255,255,255,0.35)">Free · Private · No Ads · Markdown · Dark Mode</text>
</svg>
